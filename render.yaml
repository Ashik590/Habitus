services:
  - type: web
    name: habitus
    runtime: docker
    plan: free
    repo: https://github.com/Ashik590/Habitus
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: profile-pictures
      - key: PROFILE_PICTURE_STORAGE
        value: supabase
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: lax
      - key: WHISPER_MODEL
        value: small
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
